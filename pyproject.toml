[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeweaver2"
version = "2.0.0"
description = "🕸️ Weaving insight through code. Analyze quality, runtime, and safety."
authors = [
    {name = "Vera Lynn DeGraw", email = "veralynndegraw10011@proton.me"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["code-analysis", "security", "cli", "cursor", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

# Core dependencies (required for all users)
dependencies = [
    "pydantic>=2.9.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "questionary>=2.0.1",
]

[project.optional-dependencies]
# Development dependencies (for contributors)
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

# Analysis dependencies (for advanced code analysis features)
analysis = [
    "astroid>=3.2.0",
    "radon>=6.0.1",
    "bandit>=1.7.9",
    "safety>=2.3.0",
]

# All dependencies (for full installation)
all = [
    "codeweaver2[dev,analysis]",
]

[project.urls]
Homepage = "https://github.com/VeraLynnDeGraw/CODEWEAVER2"
Repository = "https://github.com/VeraLynnDeGraw/CODEWEAVER2"
Issues = "https://github.com/VeraLynnDeGraw/CODEWEAVER2/issues"
Documentation = "https://github.com/VeraLynnDeGraw/CODEWEAVER2#readme"

[project.scripts]
codeweaver = "codeweaver2.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

# Ruff configuration (code formatter/linter)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# MyPy configuration (type checking)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
